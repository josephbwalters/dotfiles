# --- Auto-install TPM on first run (no manual cloning needed) ---
set -g @tpm_path "$HOME/.tmux/plugins/tpm"
if-shell '[ ! -d "#{@tpm_path}" ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm #{@tpm_path} && #{@tpm_path}/bin/install_plugins"'
run-shell '#{@tpm_path}/tpm'

#### TPM plugins (optional but handy) ####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christtoomey/vim-tmux-navigator'

#### Theming ####
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

#### Sensible defaults ####
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -g history-limit 100000
setw -g mode-keys vi
set -g mouse on

#### Prefix & keys ####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


#### Splits (| and -) ####
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Easier splits without prefix
bind -n C-\\ split-window -h -c "#{pane_current_path}"   # Ctrl+\  → vertical split
bind -n C-| split-window -h -c "#{pane_current_path}"    # Ctrl+|  → vertical split (shifted \)

bind -n C-- split-window -v -c "#{pane_current_path}"    # Ctrl+-  → horizontal split
bind -n C-_ split-window -v -c "#{pane_current_path}"    # Ctrl+_  → horizontal split (shifted -)


#### Pane navigation (vim-style) ####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


#### Windows ####
# bind c new-window -c '#{pane_current_path}'
# bind -n C-a n next-window
# bind -n C-a p previous-window

# Next / previous window with prefix + n / p
bind n next-window
bind p previous-window
# bind -n C-Right next-window
# bind -n C-Left previous-window


# Vim-style pane navigation on Ctrl-h/j/k/l (no prefix)
set -g xterm-keys on

bind -n C-h select-pane -L   # left
bind -n C-j select-pane -D   # down
bind -n C-k select-pane -U   # up
bind -n C-l select-pane -R   # right

# Optional: fast resize with Alt-h/j/k/l (keeps Ctrl-l free to clear if you want)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5


# --- Cross-platform clipboard (macOS pbcopy / Wayland wl-copy / X11 xclip) ---
if-shell 'command -v pbcopy >/dev/null' \
  'set -g @sys_clip "pbcopy"'
if-shell 'command -v wl-copy >/dev/null' \
  'set -g @sys_clip "wl-copy"'
if-shell '[ -z "#{@sys_clip}" ] && command -v xclip >/dev/null' \
  'set -g @sys_clip "xclip -selection clipboard -in"'

# Use whichever @sys_clip we found
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '#{@sys_clip}'

# Auto-save/restore sessions
set -g @continuum-restore 'on'

