
################################
# Hyprland — clean, current
# HM/systemd owns bar/dunst/nm/blueman/hyprpaper
################################

# --- Monitors ---
monitor = , preferred, auto, 1
monitor = DP-1,     3440x1440@144,   0x0,     1
monitor = DP-2,     2560x1440@144,  -2560x0,  1
monitor = HDMI-A-1, 2560x1440@99.95, 3440x0,  1

# Workspace 1 on the ultrawide
workspace = 1, monitor:DP-1

# --- Apps ---
$terminal    = ghostty
$fileManager = dolphin
$menu        = wofi --show drun
$browser     = vivaldi --password-store=kwallet6
$discord     = discord
$steam       = steam

# --- One-shot at session start (HM handles other daemons) ---
exec-once = hyprctl dispatch workspace 1

# --- Env (safe defaults; NVIDIA handled by NixOS) ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Tell systemd --user we're in a Wayland/Hypr session, then start the session target
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start graphical-session.target

# --- Look & Feel ---
general {
  gaps_in = 5
  gaps_out = 20
  border_size = 2
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  allow_tearing = false
  layout = dwindle
}

decoration {
  rounding = 8
  active_opacity = 1.0
  inactive_opacity = 1.0

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 6
    passes = 1
    vibrancy = 0.18
  }
}

animations {
  enabled = true
  bezier = easeOutQuint,   0.23,1,0.32,1
  bezier = easeInOutCubic, 0.65,0.05,0.36,1
  bezier = almostLinear,   0.5,0.5,0.75,1.0
  bezier = quick,          0.15,0,0.1,1

  animation = global,       1, 10, default
  animation = border,       1, 5.4,  easeOutQuint
  animation = windows,      1, 4.8,  easeOutQuint
  animation = windowsIn,    1, 4.1,  easeOutQuint, popin 87%
  animation = windowsOut,   1, 1.5,  linear,       popin 87%
  animation = fadeIn,       1, 1.7,  almostLinear
  animation = fadeOut,      1, 1.5,  almostLinear
  animation = fade,         1, 3.0,  quick
  animation = layers,       1, 3.8,  easeOutQuint
  animation = layersIn,     1, 4.0,  easeOutQuint, fade
  animation = layersOut,    1, 1.5,  linear,       fade
  animation = workspaces,   1, 2.0,  almostLinear, fade
}

# Dwindle options (valid)
dwindle {
  pseudotile = true
  preserve_split = true
}

# Master layout (current option name)
master {
  new_status = master
}

# Misc (let hyprpaper own wallpapers; drop old force_default_wallpaper)
misc {
  disable_hyprland_logo = true
}

# --- Input ---
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = false
  }
}

# NOTE: Hyprland 0.51 removed gestures.workspace_swipe. If you want swipes,
# use the new gesture bindings; otherwise keep this absent.

# --- Layer rules ---
layerrule = noanim, waybar
layerrule = noanim, notifications
layerrule = blur,   waybar

# --- Binds ---
$mainMod = SUPER

# Launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T,      exec, $terminal
bind = $mainMod, B,      exec, $browser
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, P,      exec, $menu
bind = $mainMod, Q,      killactive
bind = $mainMod, M,      exit

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Float / fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / brightness
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume     @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioMute,        exec, wpctl set-mute       @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86AudioMicMute,     exec, wpctl set-mute       @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind  = , XF86AudioNext,  exec, playerctl next
bind  = , XF86AudioPrev,  exec, playerctl previous
bind  = , XF86AudioPlay,  exec, playerctl play-pause
bind  = , XF86AudioPause, exec, playerctl play-pause

# Window rules
windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Float common control panels
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$

